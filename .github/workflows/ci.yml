name: IdeaValidator CI/CD Pipeline

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
      
    - name: Install Dependencies
      run: |
        npm ci
        cd frontend && npm ci
        cd ../backend && npm ci
      
    - name: Run Linting
      run: |
        npm run lint:frontend
        npm run lint:backend
      
    - name: Run Tests
      run: |
        npm run test:frontend
        npm run test:backend
      
    - name: Upload Test Results
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: |
          frontend/coverage/
          backend/coverage/

  build:
    name: Build
    needs: test
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
      
    - name: Install Dependencies
      run: |
        npm ci
        cd frontend && npm ci
        cd ../backend && npm ci
      
    - name: Build Frontend
      run: cd frontend && npm run build
      
    - name: Build Backend
      run: cd backend && npm run build
      
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-artifacts
        path: |
          frontend/dist/
          backend/dist/

  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: success() && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - uses: actions/checkout@v3
    
    - name: Download Build Artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-artifacts
        
    - name: Setup Environment
      run: |
        echo "Setting up environment variables for staging"
        # Hier würden wir die Umgebungsvariablen für die Staging-Umgebung einrichten
        
    - name: Deploy to Vercel (Frontend)
      uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
        working-directory: ./frontend
        
    - name: Deploy to Render (Backend)
      uses: johnbeynon/render-deploy-action@v0.0.8
      with:
        service-id: ${{ secrets.RENDER_SERVICE_ID_BACKEND_STAGING }}
        api-key: ${{ secrets.RENDER_API_KEY }}

  deploy-production:
    name: Deploy to Production
    needs: build
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
    - uses: actions/checkout@v3
    
    - name: Download Build Artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-artifacts
        
    - name: Setup Environment
      run: |
        echo "Setting up environment variables for production"
        # Hier würden wir die Umgebungsvariablen für die Produktionsumgebung einrichten
        
    - name: Deploy to Vercel (Frontend)
      uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
        working-directory: ./frontend
        vercel-args: '--prod'
        
    - name: Deploy to Render (Backend)
      uses: johnbeynon/render-deploy-action@v0.0.8
      with:
        service-id: ${{ secrets.RENDER_SERVICE_ID_BACKEND_PROD }}
        api-key: ${{ secrets.RENDER_API_KEY }} 